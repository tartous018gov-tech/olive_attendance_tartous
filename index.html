<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#556B2F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مشرفي المعاصر">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<title>رابط مشرفي معاصر الزيتون في طرطوس</title>
<style>
:root{--primary:#556B2F;--bg:#F5F3E7;--text:#2C3E1F;--success:#6B8E23;--danger:#B33A3A;--warning:#D4891A}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:12px;display:flex;flex-direction:column;min-height:100vh}
.container{max-width:460px;margin:auto;background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 15px rgba(85,107,47,.15);width:100%;flex:1}
.title{text-align:center;color:var(--primary);font-size:1.15rem;font-weight:700;margin:0 0 14px;line-height:1.4}
.banner{padding:8px 10px;border-radius:8px;font-size:13px;font-weight:bold;text-align:center;margin-bottom:10px}
.on{background:#e6f0d3;color:#3D5229;border:1px solid var(--primary)}
.off{background:#fee2e2;color:#991b1b;border:1px solid #dc2626}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;padding:6px 8px;border-radius:8px;text-align:center;background:#f8fafc;border:1px solid #e2e8f0}
.stat small{font-size:10px;color:#64748b;font-weight:bold}
.stat b{font-size:16px;display:block;margin-top:2px}
.g{margin-bottom:10px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:#475569}
input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:.95rem}
input:focus{border-color:var(--primary);outline:none}
#phoneMsg{margin-top:3px;font-size:.8rem;min-height:16px}
.err{color:var(--danger)}.ok{color:var(--success)}
.gps{padding:8px;background:#f0f4e8;border:1px solid #c8d4b0;border-radius:8px;font-size:12px;text-align:center;font-weight:bold;line-height:1.5;color:#3D5229}
.small{background:#6c757d;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:.75rem;cursor:pointer;margin-top:4px}
.cam{background:#f0f4e8;border:2px dashed var(--primary);border-radius:12px;padding:12px;text-align:center}
#vid,#prev{width:100%;max-height:300px;border-radius:8px;display:none}
#vid{background:#000}#prev{border:2px solid var(--primary);object-fit:cover}
#ph{padding:20px 10px;color:#64748b;font-size:14px}#ph span{font-size:40px;display:block;margin-bottom:8px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.cb{padding:10px 16px;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;flex:1;min-width:110px;color:#fff;display:none}
.c1{background:var(--primary)}.c2{background:#17a2b8}.c3{background:var(--success)}.c4{background:var(--warning)}.c5{background:#6c757d}
#photoStatus{font-size:12px;margin-top:6px;font-weight:bold}
#submitBtn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:8px}
#submitBtn:disabled{background:#ccc;cursor:not-allowed;opacity:.7}
#statusBox{margin-top:10px;padding:10px;border-radius:6px;text-align:center;font-size:13px;font-weight:bold;display:none}
.s-success{background:#e6f0d3;color:#3D5229;border:1px solid #a7d078}
.s-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.s-warning{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
footer{text-align:center;margin-top:15px;font-size:.72rem;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">🫒 رابط مشرفي معاصر الزيتون في طرطوس</h1>
  <div id="banner" class="banner on">🟢 متصل</div>
  <div class="stats">
    <div class="stat"><small>المرسلة</small><b id="sentCount" style="color:var(--primary)">0</b></div>
    <div class="stat"><small>المعلقة</small><b id="pendingCount" style="color:var(--warning)">0</b></div>
  </div>
  <form id="form" autocomplete="off">
    <div class="g"><label for="pressName">اسم معصرة الزيتون:</label>
      <input type="text" id="pressName" placeholder="مثال: معصرة النور" maxlength="80"></div>
    <div class="g"><label for="workerName">اسم الموظف:</label>
      <input type="text" id="workerName" placeholder="الاسم الكامل" maxlength="80"></div>
    <div class="g"><label for="phone">رقم الهاتف:</label>
      <input type="tel" id="phone" placeholder="09xxxxxxxx" inputmode="numeric" maxlength="14">
      <div id="phoneMsg"></div></div>
    <div class="g"><label>موقع GPS:</label><div id="gpsDisplay" class="gps">⏳ جاري تحديد الموقع...</div></div>
    <div class="g"><label>إرفاق صورة (من الكاميرا فقط):</label>
      <div class="cam">
        <video id="vid" autoplay playsinline muted></video>
        <img id="prev" alt="معاينة">
        <div id="ph"><span>📷</span>اضغط "فتح الكاميرا" لالتقاط الصورة</div>
        <div class="acts">
          <button type="button" id="bOpen" class="cb c1">📷 فتح الكاميرا</button>
          <button type="button" id="bSwitch" class="cb c2">🔄 تبديل</button>
          <button type="button" id="bCap" class="cb c3">📸 التقاط</button>
          <button type="button" id="bRetake" class="cb c4">🔄 إعادة</button>
          <button type="button" id="bCancel" class="cb c5">✕ إلغاء</button>
        </div>
        <div id="photoStatus"></div>
      </div></div>
    <button type="submit" id="submitBtn" disabled>إرسال</button>
  </form>
  <div id="statusBox"></div>
</div>
<footer>تم تصميم هذا الرابط من قبل<br>مديرية المعلوماتية والتقانة - شركة مياه طرطوس</footer>

<script>
// ===== الإعدادات (غيّر القيمتين التاليتين) =====
var SCRIPT_URL = "ضع_رابط_Apps_Script_هنا";   // رابط النشر الجديد /exec
var TOKEN      = "ضع_نفس_الرمز_السري_هنا";     // يجب أن يطابق TOKEN في Apps Script
var CHUNK = 3, SEND_TIMEOUT = 45000, GPS_MAX_AGE = 180000;
var DB_NAME = 'olive_db', STORE = 'queue', SENT_KEY = 'olive_sent_count';

// ===== Service Worker: تسجيل مرة واحدة دون مسح الكاش =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').then(function (r) { r.update(); }).catch(function () {});
  });
}

var $ = function (id) { return document.getElementById(id); };
var gps = null;                 // {lat,lng,acc,ts}
var photo = null, photoMime = 'image/jpeg';
var stream = null, facing = 'environment';
var sending = false, syncing = false, lastNetOk = true, hideTimer = null;

// ===== أدوات مساعدة =====
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function syriaTime() {
  var d = new Date(Date.now() + new Date().getTimezoneOffset() * 60000 + 3 * 3600000);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
         pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function lsGet(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function deviceId() {
  var id = lsGet('olive_device_id', null);
  if (!id) { id = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase(); lsSet('olive_device_id', id); }
  return id;
}
function uid() { return 'OLV-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10); }
function toEnDigits(s) {
  return s.replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
          .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); });
}
function showStatus(msg, type, ms) {
  var b = $('statusBox');
  b.textContent = msg; b.className = 's-' + type; b.style.display = 'block';
  clearTimeout(hideTimer);
  if (ms) hideTimer = setTimeout(function () { b.style.display = 'none'; }, ms);
}

// ===== IndexedDB: طابور الإرسال =====
function dbOpen() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = function () { r.result.createObjectStore(STORE, { keyPath: '_uid' }); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function dbTx(mode, fn) {
  return dbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(STORE, mode), out = fn(t.objectStore(STORE));
      t.oncomplete = function () { db.close(); res(out && out.result); };
      t.onerror = t.onabort = function () { db.close(); rej(t.error); };
    });
  });
}
function qAdd(item) { return dbTx('readwrite', function (s) { return s.put(item); }); }
function qDel(uids) { return dbTx('readwrite', function (s) { uids.forEach(function (u) { s.delete(u); }); }); }
function qAll() {
  return dbTx('readonly', function (s) { return s.getAll(); })
    .then(function (a) { return (a || []).sort(function (x, y) { return x._ts - y._ts; }); });
}

// ===== الواجهة =====
function updateUI() {
  qAll().then(function (q) { $('pendingCount').textContent = q.length; }).catch(function () {});
  $('sentCount').textContent = parseInt(lsGet(SENT_KEY, '0'), 10) || 0;
  var ok = navigator.onLine && lastNetOk, b = $('banner');
  b.className = 'banner ' + (ok ? 'on' : 'off');
  b.textContent = ok ? '🟢 متصل' : '🔴 غير متصل — سيتم الحفظ والإرسال لاحقاً';
}
function addSent(n) { lsSet(SENT_KEY, String((parseInt(lsGet(SENT_KEY, '0'), 10) || 0) + n)); }

// ===== GPS =====
function getPosition(timeout) {
  return new Promise(function (res, rej) {
    if (!navigator.geolocation) return rej({ code: 0 });
    navigator.geolocation.getCurrentPosition(function (p) {
      res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), ts: Date.now() });
    }, rej, { enableHighAccuracy: true, timeout: timeout, maximumAge: 0 });
  });
}
function startGps() {
  var d = $('gpsDisplay');
  d.textContent = '⏳ جاري تحديد الموقع...'; d.style.color = '#3D5229';
  getPosition(60000).then(function (p) {
    gps = p;
    d.textContent = '✅ الموقع: ' + p.lat.toFixed(5) + ' , ' + p.lng.toFixed(5) + ' (≈' + p.acc + 'م)';
    checkForm();
  }, function (err) {
    var m = { 0: '❌ المتصفح لا يدعم GPS', 1: '❌ تم رفض صلاحية الموقع', 2: '❌ الموقع غير متاح', 3: '❌ انتهت المهلة' }[err.code] || '❌ تعذر الحصول على الموقع';
    d.innerHTML = m + '<br><button type="button" class="small" id="gpsRetry">🔄 إعادة</button>';
    d.style.color = '#b91c1c';
    $('gpsRetry').onclick = startGps;
    checkForm();
  });
}

// ===== الهاتف =====
function cleanPhone() {
  var v = toEnDigits($('phone').value).replace(/\D/g, '').slice(0, 10);
  $('phone').value = v; return v;
}
function validatePhone() {
  var v = cleanPhone(), m = $('phoneMsg'), bad = '❌ يجب أن يبدأ رقم الهاتف بـ 09';
  if (!v) { m.textContent = ''; return false; }
  if (v[0] !== '0' || (v.length > 1 && v[1] !== '9')) { m.textContent = bad; m.className = 'err'; return false; }
  if (v.length < 10) { m.textContent = '⏳ يجب إدخال 10 أرقام (' + v.length + '/10)'; m.className = 'err'; return false; }
  m.textContent = '✓ رقم صحيح'; m.className = 'ok'; return true;
}

// ===== الكاميرا =====
function camUI(state) {   // idle | live | shot
  var show = { idle: ['bOpen'], live: ['bSwitch', 'bCap', 'bCancel'], shot: ['bRetake'] }[state];
  ['bOpen', 'bSwitch', 'bCap', 'bRetake', 'bCancel'].forEach(function (id) {
    $(id).style.display = show.indexOf(id) > -1 ? 'block' : 'none';
  });
  $('vid').style.display = state === 'live' ? 'block' : 'none';
  $('prev').style.display = state === 'shot' ? 'block' : 'none';
  $('ph').style.display = state === 'idle' ? 'block' : 'none';
}
function stopStream() {
  if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; }
}
function setPS(t, c) { $('photoStatus').textContent = t; $('photoStatus').style.color = c; }
function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('❌ متصفحك لا يدعم الكاميرا.'); return; }
  setPS('⏳ جاري فتح الكاميرا...', '#64748b');
  stopStream();
  function get(mode) {
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  }
  get({ exact: facing }).catch(function (e) { if (e.name === 'NotAllowedError') throw e; return get({ ideal: facing }); })
    .then(function (s) {
      stream = s; $('vid').srcObject = s; camUI('live');
      setPS('✅ الكاميرا ' + (facing === 'environment' ? 'الخلفية' : 'الأمامية') + ' جاهزة — اضغط "التقاط"', '#6B8E23');
    }).catch(function (e) {
      var m = { NotAllowedError: '❌ تم رفض صلاحية الكاميرا', NotFoundError: '❌ لا توجد كاميرا متاحة',
                NotReadableError: '❌ الكاميرا مستخدمة من تطبيق آخر', OverconstrainedError: '⚠️ الكاميرا المطلوبة غير متاحة' }[e.name] || '❌ تعذر فتح الكاميرا';
      stopStream(); camUI('idle'); setPS(m, '#b91c1c');
    });
}
function capture() {
  var v = $('vid');
  if (!stream || !v.videoWidth) { alert('الكاميرا غير جاهزة، انتظر لحظة'); return; }
  try {
    var c = document.createElement('canvas');
    c.width = 480; c.height = Math.round(480 * v.videoHeight / v.videoWidth);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    var url = c.toDataURL('image/webp', 0.6);
    photoMime = url.indexOf('image/webp') > -1 ? 'image/webp' : 'image/jpeg';
    if (photoMime === 'image/jpeg') url = c.toDataURL('image/jpeg', 0.65);
    photo = url.split(',')[1];
    $('prev').src = url; stopStream(); camUI('shot');
    setPS('✅ تم التقاط الصورة (~' + Math.round(photo.length * 0.75 / 1024) + ' KB)', '#6B8E23');
    checkForm();
  } catch (e) { setPS('❌ خطأ في الالتقاط', '#b91c1c'); }
}
function resetPhoto() {
  photo = null; $('prev').removeAttribute('src'); stopStream(); camUI('idle'); setPS('', ''); checkForm();
}

// ===== صلاحية النموذج =====
function checkForm() {
  var ok = $('pressName').value.trim().length >= 2 && $('workerName').value.trim().length >= 3 &&
           /^09\d{8}$/.test($('phone').value) && photo !== null && !sending &&
           (gps !== null);
  $('submitBtn').disabled = !ok;
}

// ===== الشبكة =====
function post(items) {
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, SEND_TIMEOUT);
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // طلب بسيط بلا preflight
    body: JSON.stringify(items),
    signal: ctl.signal
  }).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(t); return j; },
                                                  function (e) { clearTimeout(t); throw e; });
}

// مزامنة الطابور: لا يُحذف أي عنصر إلا بعد تأكيد الخادم
function sync() {
  if (syncing) return Promise.resolve(0);
  syncing = true;
  var total = 0, rejected = 0;
  function next() {
    return qAll().then(function (q) {
      if (!q.length) return;
      return post(q.slice(0, CHUNK)).then(function (r) {
        if (!r || r.ok !== true) throw new Error((r && r.error) || 'bad response');
        var done = r.done || [], rej = r.rejected || [];
        lastNetOk = true;
        return qDel(done.concat(rej)).then(function () {
          addSent(done.length); total += done.length; rejected += rej.length;
          if (done.length + rej.length === 0) return;
          return next();
        });
      });
    });
  }
  return next().catch(function (e) { lastNetOk = false; console.log('sync:', e); })
    .then(function () {
      syncing = false; updateUI();
      if (rejected) showStatus('⚠️ رفض الخادم ' + rejected + ' إرسالية لبيانات غير صالحة', 'error', 8000);
      return total;
    });
}

// ===== الإرسال =====
function submit(e) {
  e.preventDefault();
  if (sending || !photo) return;
  sending = true; checkForm();
  $('submitBtn').textContent = '⏳ جاري تحديد الموقع الحالي...';
  $('statusBox').style.display = 'none';

  // موقع جديد لحظة الإرسال؛ وإن فشل نقبل آخر قراءة حديثة فقط
  getPosition(20000).catch(function () {
    if (gps && Date.now() - gps.ts < GPS_MAX_AGE) return gps;
    throw new Error('gps');
  }).then(function (pos) {
    gps = pos;
    var item = {
      _uid: uid(), _ts: Date.now(), token: TOKEN,
      pressName: $('pressName').value.trim(), workerName: $('workerName').value.trim(),
      phone: $('phone').value, latitude: pos.lat, longitude: pos.lng, accuracy: pos.acc,
      gpsTime: new Date(pos.ts).toISOString(),
      photoBase64: photo, mimeType: photoMime,
      deviceTimestamp: syriaTime(), deviceId: deviceId(),
      origin: navigator.onLine ? 'متصل' : 'غير متصل'
    };
    return qAdd(item).then(function () {            // الحفظ المحلي أولاً، ولا يُفرَّغ النموذج إن فشل
      ['pressName', 'workerName', 'phone'].forEach(function (id) { $(id).value = ''; });
      $('phoneMsg').textContent = ''; resetPhoto();
      $('submitBtn').textContent = '⏳ جاري الإرسال...';
      return sync().then(function () { return qAll(); }).then(function (q) {
        var still = q.some(function (x) { return x._uid === item._uid; });
        if (still) showStatus('⚠️ تم الحفظ على الجهاز وسيُرسل عند توفر الإنترنت', 'warning', 7000);
        else showStatus('✅ تم الإرسال وتأكيد الاستلام من الخادم', 'success', 5000);
      });
    }, function () {
      showStatus('❌ تعذر الحفظ على الجهاز (الذاكرة ممتلئة؟). لم تُفرَّغ البيانات، حاول مجدداً.', 'error');
    });
  }).catch(function (err) {
    showStatus(err && err.message === 'gps' ? '❌ تعذر تحديد موقعك الحالي، فعّل GPS وحاول مجدداً' : '❌ حدث خطأ: ' + (err && err.message || ''), 'error');
  }).then(function () {
    sending = false; $('submitBtn').textContent = 'إرسال'; checkForm(); updateUI();
    setTimeout(startGps, 500);
  });
}

// ===== التشغيل =====
function init() {
  ['pressName', 'workerName'].forEach(function (id) { $(id).addEventListener('input', checkForm); });
  $('phone').addEventListener('input', function () { validatePhone(); checkForm(); });
  $('bOpen').onclick = openCamera;
  $('bSwitch').onclick = function () { facing = facing === 'environment' ? 'user' : 'environment'; openCamera(); };
  $('bCap').onclick = capture;
  $('bRetake').onclick = function () { facing = 'environment'; resetPhoto(); };
  $('bCancel').onclick = function () { stopStream(); camUI('idle'); setPS('', ''); };
  $('form').addEventListener('submit', submit);
  window.addEventListener('online', function () { lastNetOk = true; updateUI(); sync(); });
  window.addEventListener('offline', updateUI);
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopStream(); });
  camUI('idle'); startGps(); updateUI(); sync();
  setInterval(function () { if (navigator.onLine) sync(); }, 30000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
</html>
